<!doctype html>
<html>
  <head>
    <title>AI Resume Screening System</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
      }

      /* ================= NAVBAR ================= */
      nav {
        background: linear-gradient(to right, #064e3b, #022c22);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      nav h2 {
        margin: 0;
        color: white;
        font-size: 20px;
      }

      nav a {
        color: white;
        margin-left: 20px;
        text-decoration: none;
        font-size: 16px;
      }

      nav a:hover {
        color: #ebd6a3;
      }
      /* SPECIAL BUTTON */
      .nav-btn {
        padding: 8px 16px;
        border-radius: 8px;
      }

      .nav-btn:hover {
        color: #ebd6a3;
      }

      /* ================= HERO ================= */
      .hero {
        height: 100vh;

        /* background: url("/static/ai-bg.jpg") center/cover no-repeat; */

        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;

        position: relative;
      }

      /* DARK OVERLAY */
      .hero::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #fef6e4, #ecd292);
      }

      .hero-content {
        position: relative;
        z-index: 1;
        animation: fadeIn 1s ease-in-out;
      }

      .hero h1 {
        font-size: 60px;
        margin-bottom: 20px;
      }

      .hero p {
        font-size: 18px;
        margin-bottom: 30px;
      }
      .about-container {
        display: flex;
        align-items: center; /* vertical center */
        justify-content: center; /* optional: center whole section */
        gap: 50px; /* space between image & text */
        height: 80vh; /* important for vertical centering */
        padding: 20px;

        position: relative; /* ADD THIS */
        z-index: 1;
      }

      .about-image img {
        width: 450px;
        border-radius: 50%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .about-text {
        max-width: 500px;
        font-size: 20px;
        color: #333;
      }

      /* BUTTON */
      .hero button {
        padding: 15px 30px;
        font-size: 18px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
      }

      .hero button:hover {
        background: #1e40af;
      }

      .quote {
        color: #444;
      }
      .about-image img {
        width: 450px;
        /* clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); */
        border-radius: 50%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      /* ================= ANIMATION ================= */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav>
      <h2>AI Resume Screening System</h2>

      <div>
        <a href="/analyzer" class="nav-btn">Start Analyzer</a>
        <a
          class="hello"
          href="http://localhost:5000/history"
          target="_blank"
          style="color: white; margin-left: 20px"
        >
          History
        </a>
        <a href="/about">About</a>
      </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="hero">
      <div class="about-container">
        <div class="about-image">
          <img src="/static/hero_img3.png" alt="Resume Image" />
        </div>

        <div class="about-text">
          <p>
            “Hire talent, not just resumes — let AI find the potential behind
            the paper.”
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
