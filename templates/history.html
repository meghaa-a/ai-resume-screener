<!doctype html>
<html>
  <head>
    <title>Resume History</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }

      /* ================= NAVBAR ================= */
      nav {
        width: 94%;
        background: #020617;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1f2937;
      }

      nav h2 {
        margin: 0;
        color: #22c55e;
        font-size: 20px;
        font-weight: 600;
      }

      nav a {
        color: #cbd5f5;
        margin-left: 20px;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
      }

      nav a:hover {
        color: #22c55e;
      }

      /* ================= PAGE ================= */
      .container {
        padding: 40px;
      }

      h2 {
        color: #22c55e;
        margin-bottom: 20px;
      }

      /* ================= TABLE ================= */
      table {
        width: 100%;
        border-collapse: collapse;
        background: #020617;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      th {
        background: #22c55e;
        color: black;
        padding: 14px;
        font-weight: 600;
        text-align: left;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #1f2937;
        color: #e2e8f0;
      }

      tr:hover {
        background: #1e293b;
      }

      /* STRIPED EFFECT */
      tr:nth-child(even) {
        background: #020617;
      }

      tr:nth-child(odd) {
        background: #020617;
      }

      /* RESPONSIVE */
      @media (max-width: 700px) {
        table {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav>
      <h2>AI Resume Screening</h2>

      <div>
        <a href="/analyzer">Start Analyzer</a>
        <a href="/history">History</a>
        <a href="/about">About</a>
      </div>
    </nav>

    <!-- CONTENT -->
    <div class="container">
      <h2>📊 Resume Upload History</h2>

      <table>
        <tr>
          <th>ID</th>
          <th>Filename</th>
          <th>Skill Score</th>
          <th>AI Score</th>
        </tr>

        {% for row in data %}
        <tr>
          <td>{{ row[0] }}</td>
          <td>{{ row[1] }}</td>
          <td>{{ row[2] }}%</td>
          <td>{{ row[3] }}%</td>
        </tr>
        {% endfor %}
      </table>
    </div>
  </body>
</html>
